name = "suzu-plate"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 番号の保管庫。持っているのは「その5桁が使われているか」だけ
[[kv_namespaces]]
binding = "PLATES"
id = "eec1d4bcaec74580982d893ea1bdc145"

# 荒らし対策。1つのIPから1分あたり20回まで。
# KVで回数を数えると書き込み枠（1日1,000回）を食い潰すため、Cloudflare側の仕組みを使う
[[unsafe.bindings]]
name = "LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
