name = "suzu-plate"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 番号の保管庫。持っているのは「その5桁が使われているか」だけ
[[kv_namespaces]]
binding = "PLATES"
id = "eec1d4bcaec74580982d893ea1bdc145"

# 回数の制限は src/index.js 側で Cache API を使って数えている。
#
# Cloudflare の rate limiting バインディング（unsafe）も試したが、この構成では
# まったく効かなかった（1分20回の設定で45回続けても1度も止まらないことを実測）。
# KVで数えると書き込み枠（1日1,000回）を食い潰すため、Cache API に落ち着いた。
